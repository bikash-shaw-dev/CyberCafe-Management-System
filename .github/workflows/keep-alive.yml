name: Keep Render & Supabase Awake

on:
  schedule:
    # Runs every 14 minutes (just before Render's 15-minute idle spin-down)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows you to trigger this manually from the GitHub Actions tab

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API & Supabase DB
        run: |
          echo "Pinging Cyber Cafe Cloud Backend..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            --retry 3 \
            --retry-delay 5 \
            "https://cybercafe-management-system.onrender.com/Dashboard")
          
          echo "Response HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Render container and Supabase database are awake and healthy!"
          else
            echo "⚠️ Received status $HTTP_STATUS"
            exit 1
          fi