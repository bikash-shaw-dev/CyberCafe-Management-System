<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Cafe Management System</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #10b981;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .card {
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        h2 { margin-top: 0; color: var(--accent); }
        label {
            display: block;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: var(--muted);
        }
        input, select, button {
            width: 100%;
            padding: 0.75rem;
            margin-top: 0.35rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: var(--text);
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            margin-top: 1.5rem;
            background: var(--accent);
            color: #064e3b;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #statusMessage {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 8px;
            display: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>Record New Sale</h2>
    <form id="saleForm">
        <label for="customerName">Customer Name</label>
        <input type="text" id="customerName" name="customerName" placeholder="Walk-in Customer" required>

        <label for="customerPhone">Phone Number</label>
        <input type="text" id="customerPhone" name="customerPhone" placeholder="9876543210" required>

        <label for="category">Service Category</label>
        <select id="category" name="category" required>
            <option value="Printing & Scanning">Printing & Scanning</option>
            <option value="PC Gaming & Browsing">PC Gaming & Browsing</option>
            <option value="Online Form Filling">Online Form Filling</option>
            <option value="Lamination & Binding">Lamination & Binding</option>
        </select>

        <label for="totalAmount">Total Amount (₹)</label>
        <input type="number" step="0.01" id="totalAmount" name="totalAmount" placeholder="150.00" required>

        <label for="paymentStatus">Payment Method / Status</label>
        <select id="paymentStatus" name="paymentStatus" required>
            <option value="Cash in Hand">Paid - Cash in Hand</option>
            <option value="Bank">Paid - UPI / Bank</option>
            <option value="Pending">Credit (Udhaar / Unpaid)</option>
        </select>

        <button type="submit" id="submitBtn">Save Transaction</button>
    </form>
    <div id="statusMessage"></div>
</div>

<script src="app.js"></script>
</body>
</html>
