<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Cafe Management System</title>
    <!-- Supabase Auth JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #10b981;
            --danger: #ef4444;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .card {
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        h2 { margin: 0; color: var(--accent); }
        label {
            display: block;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: var(--muted);
        }
        .hint {
            font-size: 0.78rem;
            color: #64748b;
            margin-top: 0.2rem;
        }
        input, select, button {
            width: 100%;
            padding: 0.75rem;
            margin-top: 0.35rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: var(--text);
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            margin-top: 1.5rem;
            background: var(--accent);
            color: #064e3b;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .logout-btn {
            width: auto;
            margin-top: 0;
            padding: 0.4rem 0.75rem;
            font-size: 0.8rem;
            background: transparent;
            color: var(--muted);
            border: 1px solid #334155;
        }
        .logout-btn:hover {
            color: var(--danger);
            border-color: var(--danger);
        }
        .status-box {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 8px;
            display: none;
            font-size: 0.9rem;
        }
        #dashboardSection { display: none; }
    </style>
</head>
<body>

<!-- 1. OWNER LOGIN SECTION -->
<div class="card" id="loginSection">
    <h2>Owner Login</h2>
    <p class="hint">Sign in with your Supabase administrator account to access the Cyber Cafe ledger.</p>
    <form id="loginForm">
        <label for="email">Admin Email</label>
        <input type="email" id="email" placeholder="owner@cybercafe.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>

        <button type="submit" id="loginBtn">Sign In</button>
    </form>
    <div id="loginStatus" class="status-box"></div>
</div>

<!-- 2. PROTECTED SALE DASHBOARD SECTION -->
<div class="card" id="dashboardSection">
    <div class="header-row">
        <h2>Record New Sale</h2>
        <button type="button" class="logout-btn" id="logoutBtn">Sign Out</button>
    </div>
    <form id="saleForm">
        <label for="category">Service Category</label>
        <select id="category" name="category" required>
            <option value="Printing & Scanning">Printing & Scanning</option>
            <option value="PC Gaming & Browsing">PC Gaming & Browsing</option>
            <option value="Online Form Filling">Online Form Filling</option>
            <option value="Lamination & Binding">Lamination & Binding</option>
        </select>

        <label for="amount">Total Amount (₹)</label>
        <input type="number" step="0.01" id="amount" name="amount" placeholder="50.00" required>

        <label for="accountType">Payment Account (For Paid Walk-in Sales)</label>
        <select id="accountType" name="accountType" required>
            <option value="Cash in Hand">Cash in Hand</option>
            <option value="Bank">Bank / UPI</option>
        </select>

        <label for="customerName">Customer Name (Optional — For Credit / Udhaar Only)</label>
        <input type="text" id="customerName" name="customerName" placeholder="Leave blank if paid now">
        <div class="hint">Leave empty for instant paid walk-in sales. Enter a name only to record unpaid credit (Udhaar).</div>

        <button type="submit" id="submitBtn">Save Transaction</button>
    </form>
    <div id="statusMessage" class="status-box"></div>
</div>

<script src="app.js"></script>
</body>
</html>
